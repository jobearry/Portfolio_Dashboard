<section class="m-6 flex flex-col gap-3 text-start">
  @if (state().loading) {
    <div class="flex items-center gap-2 text-sm text-muted-foreground" role="status">
      <app-spinner />
      <span>Loading recent repositories...</span>
    </div>
  } @else if (state().error) {
    <div class="flex flex-col items-start gap-2 text-sm" role="alert">
      <p>{{ state().error }}</p>
      <button
        type="button"
        class="underline focus-visible:outline-2 focus-visible:outline-offset-2"
        (click)="retry()"
      >
        Try again
      </button>
    </div>
  } @else if (repositories().length) {
    <ul class="grid gap-2">
      @for (repo of repositories(); track repo.id) {
        <li
          class="transition-all duration-300 hover:transform-[translateY(-.2rem)] hover:shadow-xl"
        >
          <a [href]="repo.htmlUrl" target="_blank" rel="noopener noreferrer">
            <app-card
              [title]="repo.name"
              [subtitle]="repo.fullName"
              [description]="repo.description"
            />
          </a>
        </li>
      }
    </ul>
  } @else {
    <p class="text-sm text-muted-foreground" role="status">No public repositories to show yet.</p>
  }

  <div class="flex justify-end">
    <a
      href="/projects"
      class="w-fit rounded-sm px-3 py-1 text-xs text-slate-200 underline transition-all duration-300 hover:transform-[translateY(-.2rem)] focus-visible:outline-2 focus-visible:outline-offset-2"
    >
      View more
    </a>
  </div>
</section>
