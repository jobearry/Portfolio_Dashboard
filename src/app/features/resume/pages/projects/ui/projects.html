<section class="m-6 text-start flex flex-col">
  <div class="grid grid-cols-3 w-full">
    <button (click)="goHome()"
      class="flex items-center gap-4 h-8 m-2 cursor-pointer w-fit
        transition-all duration-300 hover:transform-[translateY(-.2rem)]">
      <ng-icon name="lucideArrowLeft" />
      Go back
    </button>
    <app-pill label="Projects" size="md" class="self-center justify-self-center"></app-pill>

    <app-theme-toggler class="self-center justify-self-end"></app-theme-toggler>
  </div>

  <app-block [id]="'pj_block_1'" [loading]="false" [title]="'Client Projects'"
    [class]="'border-0 [--card:var(--color-background)] [--card-foreground:var(--type-color)]'">
    <ng-icon slot="icon" name="lucideBlocks" />

    <ng-container slot="content">
      <app-highlights [gridStyle]="'md:grid-cols-2'" [data]="corpoProjects" class="w-[90%]" />
    </ng-container>
  </app-block>

  <app-github class="[--card:var(--color-background)] [--card-foreground:var(--type-color)]"
    [loading]="githubState().loading" [data]="githubState().content" />

  @if (githubState().error) {
    <p class="m-6 text-sm" role="alert" style="color:var(--destructive)">{{ githubState().error }}</p>
  }

  <app-footer />
</section>
