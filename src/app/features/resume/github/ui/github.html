<app-block
  [id]="'pj_block_2'"
  [loading]="loading"
  [title]="'Github Repos'"
  [class]="'border-0 bg-transparent'"
>
  <ng-icon slot="icon" name="lucideGithub" />

  <ng-container slot="content">
    @if (data.length) {
      <section class="m-6 text-start flex flex-col gap-2">
        <ul class="grid md:grid-cols-2 gap-2">
          @for (repo of data; track repo.id) {
            <li
              class="cursor-pointer transition-all duration-300 hover:transform-[translateY(-.2rem)] hover:shadow-xl"
            >
              <a [href]="repo.htmlUrl" target="_blank" rel="noopener noreferrer">
                <app-card
                  [title]="repo.name"
                  [subtitle]="repo.fullName"
                  [description]="repo.description"
                ></app-card>
              </a>
            </li>
          }
        </ul>
      </section>
    } @else if (!loading) {
      <p class="m-6 text-start text-sm" style="color: var(--muted-foreground)">
        No public repositories to show yet.
      </p>
    }
  </ng-container>
</app-block>
