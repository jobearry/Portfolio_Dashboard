<div
  class="min-h-svh bg-background text-foreground"
  [style.--shell-sidebar-width]="state.collapsed() ? '4.5rem' : '16rem'"
>
  @if (!state.isDesktop() && state.mobileOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm"
      aria-hidden="true"
      (click)="state.closeMobile(true)"
    ></div>
  }

  <app-shell-sidebar />

  <div
    class="flex min-h-svh flex-col transition-[padding] duration-200 ease-linear motion-reduce:transition-none md:pl-[var(--shell-sidebar-width)]"
  >
    <app-shell-header />

    <main class="mx-auto w-full max-w-[75rem] flex-1 p-3">
      <router-outlet />
    </main>
  </div>
</div>
