@if(_overviewService.getState().loading){
  <app-skeleton-item></app-skeleton-item>
}@else {
  <div class="grid sm:grid-cols-3 w-full gap-2 border-b p-3">
    @for(item of _overviewService.getState().content; track item.title){
      <button class="border rounded-sm w-full h-32
        flex flex-col justify-between p-2 items-start">
        <span class="text-xs text-gray-300/70 tracking-widest">
          {{item.title.toUpperCase()}}
        </span>
        <span class="text-[3rem] font-semibold">
          {{item.count}}
        </span>
        <span class="text-sm text-[#912F56]">
          {{item.subtitle}}
        </span>
      </button>
    }
  </div>
}
